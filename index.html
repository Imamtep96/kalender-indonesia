<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kalender Multi-Device Cloud</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- ================= LAYAR GERBANG LOGIN (ACCESS KEY) ================= -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md p-4">
    <div id="login-card" class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 transition-all text-center">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-inner">
        <i data-lucide="lock" class="w-8 h-8"></i>
      </div>
      <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Kunci Akses Kalender</h2>
      <p class="text-xs text-slate-500 mt-1 mb-6">Masukkan kunci akses untuk sinkronisasi antar-perangkat</p>
      
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Access Key</label>
          <div class="relative">
            <input type="password" id="access-key-input" placeholder="Masukkan kunci..." autocomplete="off"
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white pr-10">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600">
              <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
            </button>
          </div>
          <p id="login-error" class="text-xs text-rose-500 mt-2 font-medium hidden">Kunci akses salah. Silakan coba lagi.</p>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-200 active:scale-[0.98] transition">
          Buka Kalender
        </button>
      </form>
    </div>
  </div>

  <!-- ================= APLIKASI UTAMA ================= -->
  <div id="app-container" class="hidden flex-1 flex flex-col">
    <!-- Header Atas -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center shadow-md shadow-indigo-200">
            <i data-lucide="calendar" class="w-5 h-5"></i>
          </div>
          <div>
            <h1 class="text-base sm:text-lg font-extrabold text-slate-900 leading-tight">Kalender Saya</h1>
            <div class="flex items-center gap-1.5 mt-0.5">
              <span id="sync-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span id="sync-status-text" class="text-[11px] text-slate-500 font-medium">Cloud Online</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="refreshDataManual()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition">
            <i data-lucide="refresh-cw" id="refresh-icon" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Sinkronkan</span>
          </button>
          <button onclick="lockApp()" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition" title="Kunci">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Konten Dashboard -->
    <main class="max-w-6xl mx-auto w-full p-3 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
      
      <!-- Sisi Kiri: Kalender -->
      <div class="lg:col-span-7 xl:col-span-8 space-y-4">
        <div class="bg-white rounded-3xl p-4 sm:p-6 shadow-sm border border-slate-200/80">
          
          <!-- Navigasi Bulan & Tahun -->
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 id="current-month-display" class="text-xl sm:text-2xl font-black text-slate-900 capitalize"></h2>
              <p id="current-year-display" class="text-xs text-slate-400 font-bold tracking-wide mt-0.5"></p>
            </div>
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl">
              <button onclick="prevMonth()" class="p-2 hover:bg-white text-slate-700 rounded-xl transition shadow-none hover:shadow-sm">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <button onclick="goToToday()" class="px-2.5 py-1 text-xs font-bold text-indigo-600 hover:bg-white rounded-xl transition">
                Hari Ini
              </button>
              <button onclick="nextMonth()" class="p-2 hover:bg-white text-slate-700 rounded-xl transition shadow-none hover:shadow-sm">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Header Hari -->
          <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs mb-2">
            <span class="text-rose-500 py-1">Min</span>
            <span class="text-slate-500 py-1">Sen</span>
            <span class="text-slate-500 py-1">Sel</span>
            <span class="text-slate-500 py-1">Rab</span>
            <span class="text-slate-500 py-1">Kam</span>
            <span class="text-slate-500 py-1">Jum</span>
            <span class="text-slate-500 py-1">Sab</span>
          </div>

          <!-- Grid Tanggal -->
          <div id="calendar-grid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>
        </div>

        <!-- Info Libur Pada Tanggal Dipilih -->
        <div id="holiday-info-card" class="bg-rose-50 border border-rose-200/80 rounded-2xl p-3.5 flex items-start gap-3 hidden">
          <div class="w-8 h-8 rounded-xl bg-rose-500 text-white flex items-center justify-center shrink-0 shadow-sm">
            <i data-lucide="party-popper" class="w-4 h-4"></i>
          </div>
          <div>
            <h4 class="text-xs font-bold text-rose-800 uppercase tracking-wider">Hari Libur / Tanggal Merah</h4>
            <p id="holiday-info-text" class="text-sm font-semibold text-rose-950 mt-0.5"></p>
          </div>
        </div>
      </div>

      <!-- Sisi Kanan: Panel Agenda & Catatan -->
      <div class="lg:col-span-5 xl:col-span-4 flex flex-col space-y-4">
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 flex-1 flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <div>
                <span class="text-[10px] font-black uppercase text-indigo-500 tracking-wider">Catatan Tanggal</span>
                <h3 id="selected-date-display" class="text-base font-extrabold text-slate-800"></h3>
              </div>
              <span id="agenda-count-badge" class="px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-xl text-xs font-bold">0 Catatan</span>
            </div>

            <!-- Formulir Tambah Catatan -->
            <form onsubmit="handleSaveAgenda(event)" class="mt-4 space-y-3">
              <div>
                <input type="text" id="agenda-title-input" required placeholder="Judul agenda atau catatan..."
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white">
              </div>
              <div class="grid grid-cols-2 gap-2">
                <input type="time" id="agenda-time-input"
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <select id="agenda-category-input"
                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="Kerja">💼 Kerja</option>
                  <option value="Pribadi">👤 Pribadi</option>
                  <option value="Penting">⚡ Penting</option>
                  <option value="Santai">🌴 Santai</option>
                </select>
              </div>
              <button type="submit" id="submit-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-md shadow-indigo-100 flex items-center justify-center gap-1.5 transition">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                Simpan Catatan
              </button>
            </form>

            <!-- Daftar Agenda -->
            <div class="mt-5">
              <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Daftar Jadwal</h4>
              <div id="agenda-list" class="space-y-2 max-h-[300px] overflow-y-auto custom-scroll pr-1">
                <!-- Data agenda di-render via Javascript -->
              </div>
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100 mt-4 text-center">
            <p class="text-[11px] text-slate-400">Tersinkronisasi otomatis dengan akun <strong class="text-indigo-600 font-bold">Imamtp26</strong></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Pemberitahuan Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">Pesan</span>
  </div>

  <!-- SCRIPT LOGIKA APLIKASI -->
  <script>
    const ACCESS_KEY_VALID = "Imamtp26";
    
    // API Cloud REST Key-Value gratis & terbuka (terikat dengan Access Key)
    // Data disimpan di cloud publik KV sehingga iPhone dan PC membaca tempat yang sama
    const CLOUD_SYNC_ENDPOINT = "https://kv.val.run/calendar_imamtp26_vault";

    let currentDate = new Date();
    let selectedDateStr = getFormattedDate(new Date());
    let agendas = {}; // { 'YYYY-MM-DD': [ { id, title, time, category, done } ] }
    let holidays = {};

    // 1. Data Libur Nasional Otomatis
    function generateHolidays(year) {
      return {
        [`${year}-01-01`]: "Tahun Baru Masehi",
        [`${year}-05-01`]: "Hari Buruh Internasional",
        [`${year}-06-01`]: "Hari Lahir Pancasila",
        [`${year}-08-17`]: "Hari Kemerdekaan RI",
        [`${year}-12-25`]: "Hari Raya Natal",
        // Hari libur umum perkiraan
        [`${year}-02-17`]: "Tahun Baru Imlek",
        [`${year}-03-20`]: "Hari Raya Idul Fitri",
        [`${year}-03-21`]: "Cuti Bersama Idul Fitri",
        [`${year}-05-27`]: "Hari Raya Idul Adha"
      };
    }

    // Inisialisasi
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      holidays = generateHolidays(currentDate.getFullYear());

      // Cek apakah sudah pernah login di perangkat ini
      if (sessionStorage.getItem("auth_key") === ACCESS_KEY_VALID) {
        unlockApp();
      }
    });

    // 2. Autentikasi Kunci Akses
    function handleLogin(e) {
      e.preventDefault();
      const input = document.getElementById("access-key-input");
      const err = document.getElementById("login-error");
      const card = document.getElementById("login-card");

      if (input.value.trim() === ACCESS_KEY_VALID) {
        sessionStorage.setItem("auth_key", ACCESS_KEY_VALID);
        err.classList.add("hidden");
        unlockApp();
      } else {
        err.classList.remove("hidden");
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 400);
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById("access-key-input");
      const icon = document.getElementById("eye-icon");
      if (input.type === "password") {
        input.type = "text";
        icon.setAttribute("data-lucide", "eye-off");
      } else {
        input.type = "password";
        icon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }

    function unlockApp() {
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("app-container").classList.remove("hidden");
      lucide.createIcons();
      
      // Ambil data dari Cloud seketika
      fetchAgendasFromCloud();

      // Pasang Auto-Polling setiap 6 detik agar jika iPhone input, laptop langsung update tanpa reload
      setInterval(fetchAgendasFromCloud, 6000);
    }

    function lockApp() {
      sessionStorage.removeItem("auth_key");
      location.reload();
    }

    // 3. Mesin Sinkronisasi Cloud (Device 1 ⇄ Device 2)
    async function fetchAgendasFromCloud() {
      try {
        const response = await fetch(`${CLOUD_SYNC_ENDPOINT}?_t=${Date.now()}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          const cloudData = await response.json();
          if (cloudData && typeof cloudData === "object") {
            agendas = cloudData;
            renderCalendar();
            renderAgendaList();
            setSyncStatus(true, "Cloud Terhubung");
          }
        }
      } catch (err) {
        setSyncStatus(false, "Mencoba koneksi...");
      }
    }

    async function saveAgendasToCloud() {
      setSyncStatus(true, "Menyimpan ke Cloud...");
      try {
        await fetch(CLOUD_SYNC_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(agendas)
        });
        setSyncStatus(true, "Cloud Tersinkron");
        showToast("Catatan tersimpan ke semua perangkat!");
      } catch (err) {
        setSyncStatus(false, "Gagal koneksi cloud");
        showToast("Gagal menyimpan ke cloud!");
      }
    }

    function setSyncStatus(online, text) {
      const dot = document.getElementById("sync-dot");
      const label = document.getElementById("sync-status-text");
      label.textContent = text;
      if (online) {
        dot.className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
      } else {
        dot.className = "w-2 h-2 rounded-full bg-amber-500";
      }
    }

    function refreshDataManual() {
      const icon = document.getElementById("refresh-icon");
      icon.classList.add("animate-spin");
      fetchAgendasFromCloud().finally(() => {
        setTimeout(() => icon.classList.remove("animate-spin"), 600);
      });
    }

    // 4. Logika Kalender
    function getFormattedDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthsIndo = [
        "Januari", "Februari", "Maret", "April", "Mei", "Juni",
        "Juli", "Agustus", "September", "Oktober", "November", "Desember"
      ];

      document.getElementById("current-month-display").textContent = monthsIndo[month];
      document.getElementById("current-year-display").textContent = `Tahun ${year}`;

      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevTotalDays = new Date(year, month, 0).getDate();

      // Tanggal bulan sebelumnya (abu-abu)
      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const d = prevTotalDays - i;
        const cell = document.createElement("div");
        cell.className = "p-2 sm:p-3 text-center text-slate-300 font-medium text-xs sm:text-sm select-none";
        cell.textContent = d;
        grid.appendChild(cell);
      }

      const todayStr = getFormattedDate(new Date());

      // Hari dalam bulan ini
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month, day).getDay();
        const isSunday = dayOfWeek === 0;
        const isHoliday = holidays[dateStr];
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDateStr;
        const hasAgenda = agendas[dateStr] && agendas[dateStr].length > 0;

        const cell = document.createElement("button");
        cell.onclick = () => selectDate(dateStr);

        let baseClasses = "relative flex flex-col items-center justify-center p-2 sm:py-3 rounded-2xl text-xs sm:text-sm font-bold transition duration-150 active:scale-95 ";

        if (isSelected) {
          baseClasses += "bg-indigo-600 text-white shadow-lg shadow-indigo-200 z-10 ";
        } else if (isToday) {
          baseClasses += "bg-indigo-50 border-2 border-indigo-400 text-indigo-700 ";
        } else if (isSunday || isHoliday) {
          baseClasses += "text-rose-600 bg-rose-50/60 hover:bg-rose-100/70 ";
        } else {
          baseClasses += "text-slate-700 hover:bg-slate-100 ";
        }

        cell.className = baseClasses;
        cell.innerHTML = `<span>${day}</span>`;

        // Titik penanda agenda
        if (hasAgenda) {
          const dot = document.createElement("span");
          dot.className = `w-1.5 h-1.5 rounded-full mt-1 ${isSelected ? 'bg-amber-300' : 'bg-indigo-600'}`;
          cell.appendChild(dot);
        }

        grid.appendChild(cell);
      }

      updateSelectedDateUI();
    }

    function selectDate(dateStr) {
      selectedDateStr = dateStr;
      renderCalendar();
      renderAgendaList();
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      holidays = generateHolidays(currentDate.getFullYear());
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      holidays = generateHolidays(currentDate.getFullYear());
      renderCalendar();
    }

    function goToToday() {
      currentDate = new Date();
      selectedDateStr = getFormattedDate(currentDate);
      holidays = generateHolidays(currentDate.getFullYear());
      renderCalendar();
      renderAgendaList();
    }

    function updateSelectedDateUI() {
      const d = new Date(selectedDateStr);
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById("selected-date-display").textContent = d.toLocaleDateString("id-ID", options);

      // Cek info libur
      const holidayBanner = document.getElementById("holiday-info-card");
      const holidayText = document.getElementById("holiday-info-text");
      if (holidays[selectedDateStr]) {
        holidayText.textContent = holidays[selectedDateStr];
        holidayBanner.classList.remove("hidden");
      } else {
        holidayBanner.classList.add("hidden");
      }
    }

    // 5. Tambah & Hapus Catatan
    async function handleSaveAgenda(e) {
      e.preventDefault();
      const titleInput = document.getElementById("agenda-title-input");
      const timeInput = document.getElementById("agenda-time-input");
      const catInput = document.getElementById("agenda-category-input");

      const newItem = {
        id: Date.now().toString(),
        title: titleInput.value.trim(),
        time: timeInput.value || "--:--",
        category: catInput.value,
        done: false
      };

      if (!agendas[selectedDateStr]) {
        agendas[selectedDateStr] = [];
      }

      agendas[selectedDateStr].push(newItem);
      titleInput.value = "";
      timeInput.value = "";

      renderCalendar();
      renderAgendaList();

      // Kirim ke cloud seketika
      await saveAgendasToCloud();
    }

    async function deleteAgenda(id) {
      if (!agendas[selectedDateStr]) return;
      agendas[selectedDateStr] = agendas[selectedDateStr].filter(item => item.id !== id);
      if (agendas[selectedDateStr].length === 0) {
        delete agendas[selectedDateStr];
      }
      renderCalendar();
      renderAgendaList();
      await saveAgendasToCloud();
    }

    async function toggleDone(id) {
      if (!agendas[selectedDateStr]) return;
      const target = agendas[selectedDateStr].find(item => item.id === id);
      if (target) {
        target.done = !target.done;
        renderAgendaList();
        await saveAgendasToCloud();
      }
    }

    function renderAgendaList() {
      const listContainer = document.getElementById("agenda-list");
      const badge = document.getElementById("agenda-count-badge");
      const currentList = agendas[selectedDateStr] || [];

      badge.textContent = `${currentList.length} Catatan`;
      listContainer.innerHTML = "";

      if (currentList.length === 0) {
        listContainer.innerHTML = `
          <div class="p-6 text-center text-slate-400 bg-slate-50 border border-dashed border-slate-200 rounded-2xl">
            <i data-lucide="calendar-x" class="w-6 h-6 mx-auto mb-2 text-slate-300"></i>
            <p class="text-xs font-semibold">Belum ada agenda pada tanggal ini</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      currentList.forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = `flex items-center justify-between p-3 rounded-2xl border transition ${item.done ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-slate-200 hover:border-indigo-200 shadow-sm'}`;
        
        itemEl.innerHTML = `
          <div class="flex items-center gap-2.5 overflow-hidden">
            <button onclick="toggleDone('${item.id}')" class="w-5 h-5 rounded-lg border flex items-center justify-center shrink-0 ${item.done ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300'}">
              ${item.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
            </button>
            <div class="truncate">
              <p class="text-xs sm:text-sm font-bold text-slate-800 truncate ${item.done ? 'line-through text-slate-400' : ''}">${item.title}</p>
              <div class="flex items-center gap-2 text-[10px] text-slate-400 font-semibold mt-0.5">
                <span>⏰ ${item.time}</span>
                <span>•</span>
                <span class="text-indigo-600 font-bold">${item.category}</span>
              </div>
            </div>
          </div>
          <button onclick="deleteAgenda('${item.id}')" class="p-1.5 text-slate-300 hover:text-rose-500 rounded-lg hover:bg-rose-50 transition shrink-0 ml-2">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        `;
        listContainer.appendChild(itemEl);
      });

      lucide.createIcons();
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-message").textContent = msg;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 3000);
    }
  </script>
</body>
</html>
